services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: wayne-stays-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wayne_stays
      POSTGRES_PASSWORD: gotham_secure_2024
      POSTGRES_DB: wayne_stays_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wayne_stays" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wayne-stays-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wayne-stays-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=debug
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=wayne_stays
      - DB_PASSWORD=gotham_secure_2024
      - DB_NAME=wayne_stays_dev
      - DB_SSLMODE=disable
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=./img
      - LOCAL_STORAGE_URL=http://localhost:8080/static
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./img:/root/img
    networks:
      - wayne-stays-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wayne-stays-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - wayne-stays-network
  # Redis Cache (future - for availability caching, sessions)
  # redis:
  #   image: redis:7-alpine
  #   container_name: wayne-stays-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - wayne-stays-network

  # MinIO - S3-compatible storage (future - for local S3 testing)
  # minio:
  #   image: minio/minio:latest
  #   container_name: wayne-stays-minio
  #   restart: unless-stopped
  #   ports:
  #     - "9000:9000"     # API
  #     - "9001:9001"     # Console
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio_data:/data
  #   networks:
  #     - wayne-stays-network

volumes:
  postgres_data:
    driver: local
  # redis_data:
  #   driver: local
  # minio_data:
  #   driver: local

networks:
  wayne-stays-network:
    driver: bridge
